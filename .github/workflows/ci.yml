name: CI and deployment demo
run-name: ${{ (github.head_ref || github.ref_name) == 'Petch' && 'ตรวจ CI งานหลัก — Petch' || (github.head_ref || github.ref_name) == 'feat/Petch_ci_failure_test' && 'ทดสอบ CI ไม่ผ่าน — feat/Petch_ci_failure_test' || format('ตรวจ CI — {0}', github.head_ref || github.ref_name) }}
on:
  pull_request:
  push:
    branches: [main, Petch, "feat/**"]
  workflow_dispatch:
    inputs:
      deploy_demo:
        description: Run full training and deploy to an ephemeral Docker environment
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: ci-demo
      PIPELINE_RUN_ID: github-${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build locked runtime
        run: |
          mkdir -p evidence artifacts mlruns reports/generated data/raw data/interim data/processed
          docker compose -f docker-compose.airflow.yml config --quiet
          docker compose -f docker-compose.airflow.yml build airflow 2>&1 | tee evidence/build.log
      - name: Code, data and model tests
        run: |
          docker run --rm --entrypoint /bin/bash -v "$PWD:/workspace:ro" --tmpfs /workspace/artifacts:uid=50000 --tmpfs /workspace/mlruns:uid=50000 demand-airflow:local -ec '
            /opt/ml/bin/python -m pip check
            /opt/ml/bin/python -m unittest discover -s tests -v
            /home/airflow/.local/bin/python scripts/ci/check_dags.py
          ' 2>&1 | tee evidence/checks.log
      - name: Deploy and verify demo
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_demo
        run: |
          docker compose -f docker-compose.airflow.yml up -d --no-build
          docker compose -f docker-compose.airflow.yml exec -T airflow /home/airflow/.local/bin/python scripts/ci/run_demo.py "$PIPELINE_RUN_ID" 2>&1 | tee evidence/deploy.log
      - name: Collect deployment evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.deploy_demo
        run: |
          docker compose -f docker-compose.airflow.yml logs --no-color 2>&1 | sed -E "s/(Password for user 'admin': ).*/\1[REDACTED]/" > evidence/compose.log
          docker compose -f docker-compose.airflow.yml cp airflow:/workspace/artifacts/orchestration evidence/orchestration || true
          docker compose -f docker-compose.airflow.yml cp airflow:/workspace/reports/generated evidence/data-reports || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14
      - name: Stop demo services
        if: always() && github.event_name == 'workflow_dispatch' && inputs.deploy_demo
        run: docker compose -f docker-compose.airflow.yml down
